

<div id="div-form">
    <h2>Cadastro de Corrida</h2>
    <form id="form-atleta" (submit)="debugExibirTabela()">

        <label for="nome"> Descrição da Corrida  </label>
        <input type="text" name="nome" id="nome" class="input01" required maxlength="30" placeholder="Informa sobre a corrida" [(ngModel)] = 'descricao'>

          <label for="dataCadastro">data</label>

        <input type="date" name="dataCadastro" id="dataCadastro"  class="input02" required maxlength="9" placeholder="Informe a data de cadastro" [(ngModel)]= 'data' >

        <label for="km"> Distâncias disponíveis  </label>

        <input type="checkbox" name="km" id="5km" class="btnSelecao" value="5" required  [(ngModel)] = "distancia5" > 5km

        <input type="checkbox" name="km" id="10km" class="btnSelecao" value="10" required  [(ngModel)] = "distancia10" > 10KM

        <input type="checkbox" name="km" id="15km" class="btnSelecao" value="25" required [(ngModel)] = "distancia25" > 25KM
        
      
        <div id="div-btns">
            <button type="submit" id="btnAdd"> Cadastrar Atleta </button>
            <button type="reset" id="btnLimpar" > Limpar </button>

        </div>
    </form>
</div>
