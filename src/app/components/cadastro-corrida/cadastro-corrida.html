<h1>CADASTRO CORRIDA, FAZER O HTML AQUI</h1>

<div id="div-form">
    <h2>Cadastro de Corrida</h2>
    <form id="form-atleta">

        <label for="nome">Descrição da Corrida  </label>
        <input type="text" name="nome" id="nome" class="input01" required maxlength="80" placeholder="Informe seu nome" [(ngModel)] = "">

        <!-- <label for="cpf">  cpf  </label>
        <input type="text" name="cpf" id="cpf" class="input02" required maxlength="11" placeholder="Informe seu cpf" [(ngModel)] = "cpf"> -->


        <label for="km"> Distâncias disponíveis  </label>
          <label for="dataCadastro">data</label>
        <input type="date" name="dataCadastro" id="dataCadastro"  class="input02" required maxlength="9" placeholder="Informe a data de cadastro" [(ngModel)] = "">

        <input type="checkbox" name="km" id="sexoM" class="btnSelecao" value="5" required  [(ngModel)] = ""> 5km

        <input type="checkbox" name="km" id="sexoF" class="btnSelecao" value="10"  [(ngModel)] = ""> 10km

        <input type="checkbox" name="km" id="sexoN" class="btnSelecao" value="25" required [(ngModel)] = "" > 25KM
        
      
        <div id="div-btns">
            <button type="submit" id="btnAdd"> Cadastrar Atleta </button>
            <button type="reset" id="btnLimpar" > Limpar </button>

        </div>
    </form>
</div>
